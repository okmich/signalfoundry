[project]
name = "okmich-quant-utils"
version = "0.6.0"
description = "Common utilities and helper functions"
requires-python = ">=3.12"
dependencies = [
    "okmich-quant-core",

    "imageio==2.37.0",
    "ml_dtypes==0.5.3",
    "h5py==3.14.0",

    "openpyxl==3.1.5",
    "pandas==2.3.0",
    "pyarrow==20.0.0",
    "tables==3.10.2",
    "python-dotenv==1.1.1",

    "holidays==0.94"
]

[project.scripts]
raw-data-audit = "okmich_quant_utils.ohlc_audit.cli:main"

[tool.uv.sources]
okmich-quant-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
